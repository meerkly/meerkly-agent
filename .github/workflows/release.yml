name: release

# Cut a release by pushing a tag `v<X.Y.Z>` matching the version in Cargo.toml.
# The same discipline the monorepo uses for SDK releases: one version, checked
# against the tag, so a release can never claim a number the code does not carry.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          CARGO_V=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_V="${GITHUB_REF_NAME#v}"
            if [ "$TAG_V" != "$CARGO_V" ]; then
              echo "::error::tag v$TAG_V does not match Cargo.toml version $CARGO_V — bump Cargo.toml first"
              exit 1
            fi
          fi
          echo "version=$CARGO_V" >> "$GITHUB_OUTPUT"
          echo "releasing meerkly $CARGO_V"

  build:
    needs: version
    # Everything but macOS is built on Linux (the self-hosted pool when
    # LINUX_RUNNER is set): arm64 Linux and Windows are cross-compiled, so a
    # release needs hosted runners for the two macOS targets only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: "${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-unknown-linux-musl,  arch: amd64, cross: "" }
          - { runner: "${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}", target: aarch64-unknown-linux-musl, arch: arm64, cross: zigbuild }
          - { runner: "${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}", target: x86_64-pc-windows-msvc,     cross: xwin }
          - { runner: macos-14, target: aarch64-apple-darwin, cross: "" }
          - { runner: macos-14, target: x86_64-apple-darwin,  cross: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.cross == '' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # arm64 Linux and Windows are cross-compiled from amd64 Linux, so they run
      # on the self-hosted pool rather than on hosted arm64/Windows runners.
      # zig is the C toolchain for ring's arm64 build; cargo-xwin fetches the
      # MSVC CRT and Windows SDK and links with clang/lld.
      - name: zig + cargo-zigbuild
        if: matrix.cross == 'zigbuild'
        run: |
          command -v xz >/dev/null || { sudo apt-get update && sudo apt-get install -y xz-utils; }
          curl -sSfL "https://ziglang.org/download/${ZIG}/zig-linux-x86_64-${ZIG}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-${ZIG}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild
        env:
          ZIG: 0.13.0
      - name: clang + cargo-xwin
        if: matrix.cross == 'xwin'
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld llvm
          cargo install --locked cargo-xwin
      - name: build
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: |
          case "${{ matrix.cross }}" in
            zigbuild) cargo zigbuild --release --target ${{ matrix.target }} ;;
            xwin)     cargo xwin build --release --target ${{ matrix.target }} ;;
            *)        cargo build --release --target ${{ matrix.target }} ;;
          esac

      - name: stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/meerkly.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/meerkly" dist/
          fi

      - name: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          V="${{ needs.version.outputs.version }}"
          if [[ "$TARGET" == *windows* ]]; then
            command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
            zip -j "meerkly-$V-${{ matrix.target }}.zip" dist/meerkly.exe
          else
            tar -czf "meerkly-$V-${{ matrix.target }}.tar.gz" -C dist meerkly
          fi

      # Linux only: the same static binary, also as a .deb and .rpm.
      - name: deb + rpm
        if: contains(matrix.target, 'linux')
        run: |
          NFPM_VERSION=2.43.0
          case "$(uname -m)" in
            x86_64) NFPM_ARCH=x86_64 ;;
            aarch64) NFPM_ARCH=arm64 ;;
            *) echo "::error::no nfpm build for $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          VERSION="${{ needs.version.outputs.version }}" ARCH="${{ matrix.arch }}" \
            nfpm package -f packaging/nfpm.yaml -p deb -t .
          VERSION="${{ needs.version.outputs.version }}" ARCH="${{ matrix.arch }}" \
            nfpm package -f packaging/nfpm.yaml -p rpm -t .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            meerkly-*.tar.gz
            meerkly-*.zip
            *.deb
            *.rpm
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      # One checksum file over everything; install.sh verifies against it, so it
      # has to cover every artifact a user can download.
      - name: checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true

  # Point the tap at the new release. Runs after publish so the checksums it
  # bakes in describe artifacts that actually exist.
  homebrew:
    needs: [version, publish]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: render the formula
        run: |
          V="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"
          curl -fsSL "$BASE/SHA256SUMS" -o SHA256SUMS
          sha() { grep " $1\$" SHA256SUMS | awk '{print $1}'; }
          sed -e "s|%VERSION%|$V|g" \
              -e "s|%SHA_MACOS_ARM%|$(sha "meerkly-$V-aarch64-apple-darwin.tar.gz")|" \
              -e "s|%SHA_MACOS_X86%|$(sha "meerkly-$V-x86_64-apple-darwin.tar.gz")|" \
              -e "s|%SHA_LINUX_ARM%|$(sha "meerkly-$V-aarch64-unknown-linux-musl.tar.gz")|" \
              -e "s|%SHA_LINUX_X86%|$(sha "meerkly-$V-x86_64-unknown-linux-musl.tar.gz")|" \
              packaging/homebrew/meerkly.rb.tmpl > meerkly.rb
          if grep -q '%SHA\|%VERSION' meerkly.rb; then
            echo "::error::a placeholder was not substituted — is an artifact missing?"
            exit 1
          fi
          cat meerkly.rb
      - name: push it to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/meerkly/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp meerkly.rb tap/Formula/meerkly.rb
          cd tap
          git config user.name "meerkly-bot"
          git config user.email "bot@meerkly.com"
          git add Formula/meerkly.rb
          # Re-running a release for an unchanged version renders an identical
          # formula, and `git commit` with nothing staged exits non-zero — which
          # would fail a release that had in fact succeeded.
          if git diff --staged --quiet; then
            echo "formula already at ${{ needs.version.outputs.version }} — nothing to push"
          else
            git commit -m "meerkly ${{ needs.version.outputs.version }}"
            git push
          fi

  # `cargo install meerkly` — a fourth install path, and the check that the
  # published SDK really is consumable from crates.io with no local checkout.
  crates-io:
    needs: [version, build]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
